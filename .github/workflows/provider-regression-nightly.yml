name: provider-regression-nightly

on:
    schedule:
        - cron: "0 18 * * *"
    workflow_dispatch:

jobs:
    ollama-regression:
        runs-on: windows-latest
        timeout-minutes: 90

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Java 17
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "17"

            - name: Setup Python 3.11
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Setup Node (.nvmrc)
              uses: actions/setup-node@v4
              with:
                  node-version-file: ".nvmrc"

            - name: Assert Node SSOT
              shell: pwsh
              run: |
                  python scripts/check_node_version.py `
                    --nvmrc .nvmrc `
                    --package-json frontend/package.json `
                    --check-runtime

            - name: Docker compose up
              shell: pwsh
              run: docker compose -f infra/docker-compose.yml up -d

            - name: Docker compose ollama up
              shell: pwsh
              run: docker compose -f infra/docker-compose.ollama.yml up -d

            - name: Flyway migrate (audit verifier precondition)
              shell: pwsh
              run: |
                  docker compose -f infra/docker-compose.yml --profile db-tools run --rm flyway

            - name: Audit chain integrity verifier (fail-closed)
              shell: pwsh
              run: |
                  python scripts/verify_audit_chain_integrity.py `
                    --tenant-key demo-tenant `
                    --from-utc 2000-01-01T00:00:00Z `
                    --to-utc 2100-01-01T00:00:00Z `
                    --method docker-exec `
                    --compose-file infra/docker-compose.yml `
                    --compose-service postgres `
                    --output-txt docs/review/mvp_verification_pack/artifacts/audit_chain_verify_provider_nightly.txt `
                    --output-json docs/review/mvp_verification_pack/artifacts/audit_chain_verify_provider_nightly.json
                  if ($LASTEXITCODE -ne 0) {
                    Write-Error "Audit chain integrity verifier failed. Follow runbook: docs/ops/runbook/playbooks/audit_chain_integrity_incident.md"
                    exit 1
                  }

            - name: Run provider regression (SKIPPED allowed)
              shell: pwsh
              env:
                  APP_OLLAMA_BASE_URL: ${{ secrets.APP_OLLAMA_BASE_URL }}
              run: |
                  powershell -ExecutionPolicy Bypass -File scripts/run_provider_regression.ps1
                  if (Test-Path "docs/review/mvp_verification_pack/artifacts/provider_regression_ollama.log") {
                    $content = Get-Content "docs/review/mvp_verification_pack/artifacts/provider_regression_ollama.log" -Raw
                    if ($content -match "status=SKIPPED") {
                      Write-Error "provider regression nightly skipped (NEEDS_ENV)"
                      exit 1
                    }
                  }

            - name: Upload provider regression artifact
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: provider-regression-artifacts
                  path: |
                      docs/review/mvp_verification_pack/artifacts/provider_regression_ollama.log
                      docs/review/mvp_verification_pack/artifacts/provider_regression_backend.log
                      docs/review/mvp_verification_pack/artifacts/audit_chain_verify_provider_nightly.txt
                      docs/review/mvp_verification_pack/artifacts/audit_chain_verify_provider_nightly.json

            - name: Docker compose down
              if: always()
              shell: pwsh
              run: |
                  docker compose -f infra/docker-compose.yml down -v
                  docker compose -f infra/docker-compose.ollama.yml down -v
