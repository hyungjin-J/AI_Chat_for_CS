name: pr-smoke-contract

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  smoke-contract:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Node (.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Assert Node SSOT
        shell: pwsh
        run: |
          python scripts/check_node_version.py `
            --nvmrc .nvmrc `
            --package-json frontend/package.json `
            --check-runtime

      - name: Backend tests
        shell: pwsh
        working-directory: backend
        run: .\gradlew.bat test --no-daemon

      - name: Frontend tests/build
        shell: pwsh
        working-directory: frontend
        run: |
          npm ci --prefer-offline --no-audit --fund=false
          npm run test:run -- --runInBand
          npm run build

      - name: Spec consistency check
        shell: pwsh
        run: |
          python scripts/spec_consistency_check.py

      - name: Fixed artifact contract check
        shell: pwsh
        run: |
          python scripts/assert_fixed_artifact_paths.py `
            --output-txt docs/review/mvp_verification_pack/artifacts/phase2_1_3_fixed_artifact_contract_check.txt

      - name: Gate regression unittest
        shell: pwsh
        run: |
          python -m unittest discover -s scripts/tests -p "test_*.py" *>&1 `
            | Tee-Object -FilePath docs/review/mvp_verification_pack/artifacts/phase2_1_3_unittest_output.txt
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: ChatGPT handoff doc lint
        shell: pwsh
        run: |
          python scripts/lint_chatgpt_handoff_docs.py `
            --files chatGPT/CHATGPT_SELF_CONTAINED_BRIEFING_EN.md chatGPT/IMPLEMENTATION_GUIDE_FOR_CHATGPT.md `
            --output-json docs/review/mvp_verification_pack/artifacts/phase2_1_3_chatgpt_doc_lint.json `
            --output-txt docs/review/mvp_verification_pack/artifacts/phase2_1_3_chatgpt_doc_lint.txt

      - name: Upload gate evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-evidence-${{ github.workflow }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            docs/review/mvp_verification_pack/artifacts/phase2_1_3_*
            docs/review/mvp_verification_pack/artifacts/phase2_1_4_*
            scripts/contracts/fixed_artifact_paths.json
