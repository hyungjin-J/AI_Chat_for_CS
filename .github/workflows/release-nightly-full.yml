name: release-nightly-full

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

jobs:
  full-regression:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Node (.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Assert Node SSOT
        shell: pwsh
        run: |
          python scripts/check_node_version.py `
            --nvmrc .nvmrc `
            --package-json frontend/package.json `
            --check-runtime

      - name: Print Node runtime diagnostic
        shell: pwsh
        run: |
          node -v *>&1 | Tee-Object -FilePath docs/review/mvp_verification_pack/artifacts/node_runtime_discipline_check.txt
          npm -v *>&1 | Tee-Object -FilePath docs/review/mvp_verification_pack/artifacts/node_runtime_discipline_check.txt -Append

      - name: Workpack + specialized agent report contract
        shell: pwsh
        run: |
          git fetch --no-tags --depth=1 origin main
          python scripts/assert_workpack_agent_report_contract.py `
            --use-git-diff `
            --git-base-ref "origin/main" `
            --output-txt docs/review/mvp_verification_pack/artifacts/workpack_agent_contract_v2.txt `
            --output-json docs/review/mvp_verification_pack/artifacts/workpack_agent_contract_v2.json

      - name: Spec sync report update gate
        shell: pwsh
        run: |
          python scripts/assert_spec_sync_report_updated.py `
            --base-ref "origin/main" `
            --head-ref "HEAD" `
            --require-metadata `
            --require-notion-evidence-format `
            --output-txt docs/review/mvp_verification_pack/artifacts/spec_sync_report_gate.txt `
            --output-json docs/review/mvp_verification_pack/artifacts/spec_sync_report_gate.json

      - name: ChatGPT handoff update gate
        shell: pwsh
        run: |
          python scripts/assert_chatgpt_handoff_updated.py `
            --base-ref "origin/main" `
            --head-ref "HEAD" `
            --mode "core-only" `
            --output-txt docs/review/mvp_verification_pack/artifacts/chatgpt_handoff_update_gate.txt `
            --output-json docs/review/mvp_verification_pack/artifacts/chatgpt_handoff_update_gate.json

      - name: Workpack trigger consistency gate
        shell: pwsh
        run: |
          python scripts/assert_workpack_trigger_consistency.py `
            --output-txt docs/review/mvp_verification_pack/artifacts/continuation_trigger_consistency_gate.txt `
            --output-json docs/review/mvp_verification_pack/artifacts/continuation_trigger_consistency_gate.json

      - name: Domain layer purity ratchet gate
        shell: pwsh
        run: |
          python scripts/assert_domain_layer_boundaries.py `
            --git-base-ref "origin/main" `
            --output-txt docs/review/mvp_verification_pack/artifacts/domain_layer_boundary_gate.txt `
            --output-json docs/review/mvp_verification_pack/artifacts/domain_layer_boundary_gate.json

      - name: Mapper namespace drift gate
        shell: pwsh
        run: |
          python scripts/verify_mapper_namespaces.py `
            --output-txt docs/review/mvp_verification_pack/artifacts/mapper_namespace_gate.txt `
            --output-json docs/review/mvp_verification_pack/artifacts/mapper_namespace_gate.json

      - name: Legacy package reintroduction blocker
        shell: pwsh
        run: |
          python scripts/block_legacy_packages.py `
            --output-txt docs/review/mvp_verification_pack/artifacts/legacy_package_blocker.txt `
            --output-json docs/review/mvp_verification_pack/artifacts/legacy_package_blocker.json

      - name: Backoffice ACL boundary ratchet gate
        shell: pwsh
        run: |
          python scripts/assert_backoffice_acl_boundary.py `
            --git-base-ref "origin/main" `
            --output-txt docs/review/mvp_verification_pack/artifacts/backoffice_acl_boundary_gate.txt `
            --output-json docs/review/mvp_verification_pack/artifacts/backoffice_acl_boundary_gate.json

      - name: Frontend import boundary gate
        shell: pwsh
        run: |
          python scripts/assert_frontend_import_boundaries.py `
            --output-txt docs/review/mvp_verification_pack/artifacts/frontend_import_boundary_gate.txt `
            --output-json docs/review/mvp_verification_pack/artifacts/frontend_import_boundary_gate.json

      - name: UTF-8 strict decode gate
        shell: pwsh
        run: |
          git fetch --no-tags --depth=1 origin main
          python scripts/assert_utf8_strict.py `
            --use-git-diff `
            --git-base-ref "origin/main" `
            --output-txt docs/review/mvp_verification_pack/artifacts/continuation_utf8_strict_gate.txt `
            --output-json docs/review/mvp_verification_pack/artifacts/continuation_utf8_strict_gate.json

      - name: UTF-8 full-scan ratchet gate
        shell: pwsh
        run: |
          python scripts/assert_utf8_strict.py `
            --full-scan `
            --baseline-file docs/review/mvp_verification_pack/artifacts/utf8_full_scan_baseline_violations.json `
            --git-base-ref "origin/main" `
            --output-txt docs/review/mvp_verification_pack/artifacts/utf8_full_scan_ratchet_gate.txt `
            --output-json docs/review/mvp_verification_pack/artifacts/utf8_full_scan_ratchet_gate.json

      - name: Artifact index freshness gate
        shell: pwsh
        run: |
          python scripts/build_artifact_index.py `
            --check `
            --artifact-root docs/review/mvp_verification_pack/artifacts `
            --index-md docs/review/mvp_verification_pack/artifacts/_INDEX.md `
            --index-json docs/review/mvp_verification_pack/artifacts/_INDEX.json `
            --gate-output-txt docs/review/mvp_verification_pack/artifacts/artifact_index_gate.txt `
            --gate-output-json docs/review/mvp_verification_pack/artifacts/artifact_index_gate.json

      - name: Scaffold contract smoke gate
        shell: pwsh
        run: |
          python scripts/assert_scaffold_contract_smoke.py `
            --output-txt docs/review/mvp_verification_pack/artifacts/scaffold_contract_smoke.txt `
            --output-json docs/review/mvp_verification_pack/artifacts/scaffold_contract_smoke.json

      - name: Start infra
        shell: pwsh
        run: docker compose -f infra/docker-compose.yml up -d

      - name: Backend full tests
        shell: pwsh
        working-directory: backend
        run: .\gradlew.bat test --no-daemon

      - name: Frontend full tests/build
        shell: pwsh
        working-directory: frontend
        run: |
          npm ci
          npm run test:run
          npm run build

      - name: Spec consistency check
        shell: pwsh
        run: |
          python scripts/spec_consistency_check.py `
            --report-json docs/review/mvp_verification_pack/artifacts/spec_consistency_check_report.json `
            --report-txt docs/review/mvp_verification_pack/artifacts/spec_consistency_check_report.txt `
            --pass-artifact docs/review/mvp_verification_pack/artifacts/spec_consistency_check_pass.txt

      - name: Verification pack consistency
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/assert_verification_pack_consistency.ps1

      - name: ChatGPT handoff doc lint
        shell: pwsh
        run: |
          python scripts/lint_chatgpt_handoff_docs.py `
            --files chatGPT/CHATGPT_SELF_CONTAINED_BRIEFING_EN.md chatGPT/IMPLEMENTATION_GUIDE_FOR_CHATGPT.md `
            --output-json docs/review/mvp_verification_pack/artifacts/phase2_1_1_prB_chatgpt_doc_lint.json `
            --output-txt docs/review/mvp_verification_pack/artifacts/phase2_1_1_prB_chatgpt_doc_lint.txt

      - name: Upload gate evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-evidence-${{ github.workflow }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            docs/review/mvp_verification_pack/artifacts/phase2_1_3_*
            docs/review/mvp_verification_pack/artifacts/phase2_1_4_*
            docs/review/mvp_verification_pack/artifacts/workpack_agent_contract_v2.*
            docs/review/mvp_verification_pack/artifacts/continuation_trigger_consistency_gate.*
            docs/review/mvp_verification_pack/artifacts/domain_layer_boundary_gate.*
            docs/review/mvp_verification_pack/artifacts/backoffice_acl_boundary_gate.*
            docs/review/mvp_verification_pack/artifacts/frontend_import_boundary_gate.*
            docs/review/mvp_verification_pack/artifacts/continuation_utf8_strict_gate.*
            docs/review/mvp_verification_pack/artifacts/utf8_full_scan_ratchet_gate.*
            docs/review/mvp_verification_pack/artifacts/artifact_index_gate.*
            docs/review/mvp_verification_pack/artifacts/_INDEX.*
            docs/review/mvp_verification_pack/artifacts/scaffold_contract_smoke.*
            docs/review/mvp_verification_pack/artifacts/node_runtime_discipline_check.txt
            docs/review/mvp_verification_pack/artifacts/mapper_namespace_gate.*
            docs/review/mvp_verification_pack/artifacts/legacy_package_blocker.*
            docs/review/mvp_verification_pack/artifacts/spec_sync_report_gate.*
            docs/review/mvp_verification_pack/artifacts/chatgpt_handoff_update_gate.*
            docs/review/mvp_verification_pack/artifacts/chatgpt_handoff_remediation_summary.txt
            docs/review/mvp_verification_pack/artifacts/spec_consistency_check_report.*
            docs/review/mvp_verification_pack/artifacts/spec_consistency_check_pass.txt
            docs/review/mvp_verification_pack/artifacts/windows_npm_lock_diag_bundle.zip
            scripts/contracts/fixed_artifact_paths.json

      - name: Stop infra
        if: always()
        shell: pwsh
        run: docker compose -f infra/docker-compose.yml down -v
