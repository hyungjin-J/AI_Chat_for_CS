name: db-repro-nightly

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

concurrency:
  group: db-repro-nightly
  cancel-in-progress: false

jobs:
  db-repro:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      COMPOSE_FILE: infra/docker-compose.yml
      ARTIFACT_ROOT: docs/review/mvp_verification_pack/artifacts
      DB_SMOKE_TXT: docs/review/mvp_verification_pack/artifacts/db_local_readiness_smoke.txt
      DB_SMOKE_JSON: docs/review/mvp_verification_pack/artifacts/db_local_readiness_smoke.json
      COMPOSE_PS_TXT: docs/review/mvp_verification_pack/artifacts/db_readiness_compose_ps.txt
      FLYWAY_OUT_TXT: docs/review/mvp_verification_pack/artifacts/db_readiness_flyway_output.txt
      HEALTH_WITHOUT_TXT: docs/review/mvp_verification_pack/artifacts/db_backend_health_without_trace_raw.txt
      HEALTH_WITH_TXT: docs/review/mvp_verification_pack/artifacts/db_backend_health_with_trace_raw.txt
      HEALTH_GATE_TXT: docs/review/mvp_verification_pack/artifacts/db_backend_health_trace_gate.txt
      HEALTH_GATE_JSON: docs/review/mvp_verification_pack/artifacts/db_backend_health_trace_gate.json
      COMPOSE_LOGS_TXT: docs/review/mvp_verification_pack/artifacts/db_readiness_compose_logs.txt
      HEALTH_ENDPOINT: http://localhost:8080/actuator/health

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure artifact directory
        shell: pwsh
        run: New-Item -ItemType Directory -Path "${env:ARTIFACT_ROOT}" -Force | Out-Null

      - name: Compose down clean volume
        shell: pwsh
        run: docker compose -f "${env:COMPOSE_FILE}" down -v

      - name: Compose up postgres and redis
        shell: pwsh
        run: docker compose -f "${env:COMPOSE_FILE}" up -d postgres redis

      - name: Snapshot compose status
        shell: pwsh
        run: |
          docker compose -f "${env:COMPOSE_FILE}" ps *>&1 `
            | Tee-Object -FilePath "${env:COMPOSE_PS_TXT}"

      - name: Run flyway migration
        shell: pwsh
        run: |
          docker compose -f "${env:COMPOSE_FILE}" --profile db-tools run --rm flyway *>&1 `
            | Tee-Object -FilePath "${env:FLYWAY_OUT_TXT}"

      - name: Run DB smoke and assert PASS
        shell: pwsh
        run: |
          python scripts/db_smoke_test.py `
            --method docker-exec `
            --compose-file "${env:COMPOSE_FILE}" `
            --compose-service postgres `
            --docker-unavailable-policy fail `
            --output-txt "${env:DB_SMOKE_TXT}" `
            --output-json "${env:DB_SMOKE_JSON}"

          $smoke = Get-Content "${env:DB_SMOKE_JSON}" -Raw -Encoding utf8 | ConvertFrom-Json
          if ($smoke.status -ne "PASS") {
            throw "db_smoke_test failed: status=$($smoke.status)"
          }

      - name: Compose up backend (only after smoke PASS)
        shell: pwsh
        run: docker compose -f "${env:COMPOSE_FILE}" --profile demo-stack up -d backend

      - name: Verify fail-closed health trace contract (409/200, always-write)
        if: always()
        shell: pwsh
        run: |
          python scripts/db_backend_health_trace_gate.py `
            --endpoint "${env:HEALTH_ENDPOINT}" `
            --trace-header "X-Trace-Id" `
            --trace-id "11111111-1111-1111-1111-111111111111" `
            --without-trace-expected 409 `
            --with-trace-expected 200 `
            --readiness-timeout-sec 240 `
            --poll-interval-sec 2 `
            --http-timeout-sec 5 `
            --docker-preflight `
            --docker-unavailable-policy fail `
            --output-txt "${env:HEALTH_GATE_TXT}" `
            --output-json "${env:HEALTH_GATE_JSON}" `
            --without-trace-raw "${env:HEALTH_WITHOUT_TXT}" `
            --with-trace-raw "${env:HEALTH_WITH_TXT}"

          if ($LASTEXITCODE -ne 0) {
            throw "health trace contract failed: exit_code=$LASTEXITCODE"
          }

      - name: Collect compose logs
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          $sb = New-Object System.Text.StringBuilder
          $services = @("postgres", "redis", "backend")
          foreach ($service in $services) {
            [void]$sb.AppendLine("=== $service ===")
            $output = docker compose -f "${env:COMPOSE_FILE}" logs --no-color $service 2>&1
            if ($output) {
              foreach ($line in $output) {
                [void]$sb.AppendLine($line.ToString())
              }
            }
            [void]$sb.AppendLine("")
          }
          [System.IO.File]::WriteAllText([System.IO.Path]::GetFullPath("${env:COMPOSE_LOGS_TXT}"), $sb.ToString(), $utf8NoBom)
          exit 0

      - name: Upload DB reproducibility artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-repro-nightly-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            docs/review/mvp_verification_pack/artifacts/db_local_readiness_smoke.txt
            docs/review/mvp_verification_pack/artifacts/db_local_readiness_smoke.json
            docs/review/mvp_verification_pack/artifacts/db_backend_health_trace_gate.txt
            docs/review/mvp_verification_pack/artifacts/db_backend_health_trace_gate.json
            docs/review/mvp_verification_pack/artifacts/db_backend_health_without_trace_raw.txt
            docs/review/mvp_verification_pack/artifacts/db_backend_health_with_trace_raw.txt
            docs/review/mvp_verification_pack/artifacts/db_readiness_compose_ps.txt
            docs/review/mvp_verification_pack/artifacts/db_readiness_flyway_output.txt
            docs/review/mvp_verification_pack/artifacts/db_readiness_compose_logs.txt

      - name: Compose down clean volume
        if: always()
        shell: pwsh
        run: |
          docker compose -f "${env:COMPOSE_FILE}" down -v
          exit 0
